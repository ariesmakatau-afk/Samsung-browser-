name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.1 build-tools;37.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew assembleRelease lintDebug --no-daemon

      # Fails the build if the APK gains extra permissions, tracking/analytics/ads/crash
      # SDKs, its own network code, device-ID APIs, or unreviewed hard-coded URLs.
      - name: Privacy audit
        run: tools/privacy-audit.sh app/build/outputs/apk/release/app-release.apk

      - name: APK fingerprint
        run: sha256sum app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroTrace-apk
          path: app/build/outputs/apk/release/app-release.apk
